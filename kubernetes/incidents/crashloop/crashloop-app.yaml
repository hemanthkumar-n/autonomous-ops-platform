apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app
  namespace: ai-lab
  labels:
    app: crashloop-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-app
  template:
    metadata:
      labels:
        app: crashloop-app
    spec:
      containers:
        - name: crashloop-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - "echo simulated startup failure; exit 1"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
