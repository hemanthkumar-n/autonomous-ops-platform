apiVersion: v1
kind: Pod
metadata:
  name: oversized-scheduling-demo
  namespace: ai-lab
  labels:
    app: oversized-scheduling-demo
spec:
  containers:
    - name: oversized
      image: busybox:1.36
      command:
        - sh
        - -c
        - "sleep 3600"
      resources:
        requests:
          cpu: "999"
          memory: 999Gi
        limits:
          cpu: "999"
          memory: 999Gi
